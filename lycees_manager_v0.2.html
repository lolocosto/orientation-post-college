    <script>
/**
 * Client API Onisep pour extraction des données lycées
 * Utilisation : const api = new OnisepAPI(); await api.extractRennesMetropole(callback);
 */
class OnisepAPI {
    constructor() {
        this.baseURL = 'https://api.opendata.onisep.fr/api/1.0';
        this.datasets = {
            structures: '5fa5816ac6a6e',      // Lycées
            actions: '66263935522cd',         // Actions de formation + langues
            formations: '5fa591127f501'       // Formations initiales
        };
        this.requestCount = 0;
    }
    
    /**
     * Recherche des établissements (lycées)
     */
    async searchStructures(params = {}) {
        const url = new URL(`${this.baseURL}/dataset/${this.datasets.structures}/search`);
        
        url.searchParams.append('size', params.size || 100);
        
        if (params.commune) url.searchParams.append('facet.commune', params.commune);
        if (params.region) url.searchParams.append('facet.region', params.region);
        if (params.academie) url.searchParams.append('facet.academie', params.academie);
        if (params.type) url.searchParams.append('facet.type', params.type);
        
        try {
            this.requestCount++;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.results || [];
        } catch (error) {
            console.error('Erreur searchStructures:', error);
            throw new Error(`Erreur API Onisep: ${error.message}`);
        }
    }
    
    /**
     * Récupère les actions de formation d'un établissement
     */
    async getActionsFormation(uai) {
        const url = new URL(`${this.baseURL}/dataset/${this.datasets.actions}/search`);
        url.searchParams.append('facet.uai_lieu_de_cours', uai);
        url.searchParams.append('size', 300);
        
        try {
            this.requestCount++;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.results || [];
        } catch (error) {
            console.error(`Erreur getActionsFormation pour ${uai}:`, error);
            return [];
        }
    }
    
    /**
     * Extrait toutes les données pour les lycées de Rennes Métropole
     */
    async extractRennesMetropole(progressCallback) {
        const communes = ['Rennes', 'Cesson-Sévigné', 'Bruz', 'Le Rheu', 'Saint-Grégoire'];
        
        const result = {
            lycees: [],
            diplomes: new Map(),      // code -> diplome
            formations: new Map(),     // code -> formation
            dispositifs: new Map(),    // nom -> dispositif
            langues: new Map(),        // nom -> langue
            stats: {
                lyceesTotal: 0,
                actionsTotal: 0,
                requestCount: 0
            }
        };
        
        // Étape 1: Récupérer tous les lycées
        progressCallback({ 
            step: 'search', 
            message: 'Recherche des lycées...',
            percent: 0
        });
        
        for (let i = 0; i < communes.length; i++) {
            const commune = communes[i];
            const structures = await this.searchStructures({ commune, size: 100 });
            
            // Filtrer uniquement les lycées
            const lycees = structures.filter(s => {
                const type = (s.type || '').toLowerCase();
                return type.includes('lycée') || type.includes('lycee');
            });
            
            result.lycees.push(...lycees);
            
            progressCallback({
                step: 'search',
                message: `Recherche: ${commune} (${lycees.length} lycées)`,
                percent: ((i + 1) / communes.length) * 20
            });
            
            await this._sleep(300);
        }
        
        result.stats.lyceesTotal = result.lycees.length;
        
        // Étape 2: Pour chaque lycée, récupérer les actions de formation
        for (let i = 0; i < result.lycees.length; i++) {
            const lycee = result.lycees[i];
            const uai = lycee.uai;
            const nom = lycee.nom || 'Sans nom';
            
            progressCallback({
                step: 'extract',
                message: `Extraction: ${nom}`,
                current: i + 1,
                total: result.lycees.length,
                percent: 20 + ((i + 1) / result.lycees.length) * 70
            });
            
            const actions = await this.getActionsFormation(uai);
            lycee.actions_formation = actions;
            result.stats.actionsTotal += actions.length;
            
            // Extraire les données des actions
            for (const action of actions) {
                this._extractFromAction(action, result);
            }
            
            await this._sleep(400);
        }
        
        // Étape 3: Finalisation
        progressCallback({
            step: 'finalize',
            message: 'Finalisation...',
            percent: 95
        });
        
        result.stats.requestCount = this.requestCount;
        
        // Convertir Maps en Arrays
        const finalResult = {
            lycees: result.lycees,
            diplomes: Array.from(result.diplomes.values()),
            formations: Array.from(result.formations.values()),
            dispositifs: Array.from(result.dispositifs.values()),
            langues: Array.from(result.langues.values()),
            stats: result.stats
        };
        
        progressCallback({
            step: 'done',
            message: 'Extraction terminée !',
            percent: 100
        });
        
        return finalResult;
    }
    
    /**
     * Extrait diplômes, formations, langues, dispositifs depuis une action
     */
    _extractFromAction(action, result) {
        // Formations et diplômes
        const libelle = action.libelle_formation_principal || '';
        
        if (libelle) {
            // Déterminer si c'est un diplôme ou une formation
            const isDiplome = libelle.includes('BTS') || 
                            libelle.includes('CAP') || 
                            libelle.includes('Bac ') ||
                            libelle.includes('BUT') ||
                            libelle.includes('DN') ||
                            libelle.includes('BMA');
            
            if (isDiplome) {
                const code = this._generateCode(libelle);
                if (!result.diplomes.has(code)) {
                    result.diplomes.set(code, {
                        code: code,
                        intitule: libelle,
                        niveau: this._detectNiveau(libelle)
                    });
                }
            } else if (libelle.includes('CPGE') || libelle.includes('2de') || libelle.includes('1re')) {
                const code = this._generateCode(libelle);
                if (!result.formations.has(code)) {
                    result.formations.set(code, {
                        code: code,
                        intitule: libelle
                    });
                }
            }
        }
        
        // Langues (LV1, LV2, LV3)
        const langues_lv = action.langues_vivantes_1_et_2 || '';
        if (langues_lv) {
            this._extractLangues(langues_lv, result.langues);
        }
        
        // Langues anciennes / régionales (à implémenter si disponible)
        // TODO: Chercher dans d'autres champs
    }
    
    /**
     * Extrait les langues depuis le champ "LV1 : ... / LV2 : ..."
     */
    _extractLangues(languesStr, languesMap) {
        // Format: "LV1 : Anglais / LV2 : Allemand, Espagnol"
        const parts = languesStr.split('/');
        
        for (const part of parts) {
            const match = part.match(/(LV\d+)\s*:\s*(.+)/);
            if (match) {
                const niveau = match[1]; // LV1, LV2, LV3
                const langues = match[2].split(',').map(l => l.trim());
                
                for (const langue of langues) {
                    if (langue && langue !== '') {
                        const code = this._generateCode(langue);
                        if (!languesMap.has(code)) {
                            languesMap.set(code, {
                                code: code,
                                nom: langue,
                                type: 'Langue vivante étrangère',
                                niveaux: new Set()
                            });
                        }
                        languesMap.get(code).niveaux.add(niveau);
                    }
                }
            }
        }
    }
    
    /**
     * Détecte le niveau d'un diplôme
     */
    _detectNiveau(libelle) {
        if (libelle.includes('CAP')) return 'CAP';
        if (libelle.includes('Bac pro') || libelle.includes('Bac techno')) return 'Bac';
        if (libelle.includes('Bac général')) return 'Bac';
        if (libelle.includes('BTS') || libelle.includes('BUT') || libelle.includes('BMA')) return 'Bac+2';
        if (libelle.includes('Licence')) return 'Bac+3';
        if (libelle.includes('Master')) return 'Bac+5';
        return 'Autre';
    }
    
    /**
     * Génère un code unique basé sur le libellé
     */
    _generateCode(libelle) {
        return libelle.toLowerCase()
            .replace(/[^a-z0-9]+/g, '_')
            .replace(/^_|_$/g, '')
            .substring(0, 50);
    }
    
    /**
     * Pause pour respecter le rate limiting
     */
    _sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
}

// Rendre disponible globalement
if (typeof window !== 'undefined') {
    window.OnisepAPI = OnisepAPI;
}
    
    // Variables globales
    let db = null;
    let SQL = null;
    
    // Initialisation au chargement
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            // Charger SQL.js
            SQL = await initSqlJs({
                locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
            });
            
            // Créer ou charger la base
            await initDatabase();
            
            // Charger les données
            loadStats();
            loadLycees();
            
        } catch (error) {
            console.error('Erreur initialisation:', error);
            showAlert('Erreur lors de l\'initialisation de la base de données', 'error');
        }
    });
    
    /**
     * Initialise la base de données
     */
    async function initDatabase() {
        // Essayer de charger depuis localStorage
        const savedDb = localStorage.getItem('lycees_database');
        
        if (savedDb) {
            const buffer = Uint8Array.from(atob(savedDb), c => c.charCodeAt(0));
            db = new SQL.Database(buffer);
            console.log('✓ Base chargée depuis localStorage');
        } else {
            // Créer une nouvelle base
            db = new SQL.Database();
            createTables();
            console.log('✓ Nouvelle base créée');
        }
    }
    
    /**
     * Crée les tables de la base
     */
    function createTables() {
        db.run(`
            CREATE TABLE IF NOT EXISTS lycees (
                code INTEGER PRIMARY KEY,
                nom TEXT NOT NULL,
                type TEXT,
                statut TEXT,
                uai TEXT UNIQUE,
                adresse_postale TEXT,
                code_postal TEXT,
                commune TEXT,
                telephone TEXT,
                adresse_mail TEXT,
                site_web TEXT,
                effectifs INTEGER,
                longitude_x REAL,
                latitude_y REAL,
                localisation TEXT
            )
        `);
        
        db.run(`
            CREATE TABLE IF NOT EXISTS diplomes (
                code INTEGER PRIMARY KEY,
                intitule TEXT NOT NULL,
                niveau TEXT
            )
        `);
        
        db.run(`
            CREATE TABLE IF NOT EXISTS formations (
                code INTEGER PRIMARY KEY,
                intitule TEXT NOT NULL
            )
        `);
        
        db.run(`
            CREATE TABLE IF NOT EXISTS dispositifs (
                code INTEGER PRIMARY KEY,
                nom TEXT NOT NULL,
                information_complementaire TEXT
            )
        `);
        
        db.run(`
            CREATE TABLE IF NOT EXISTS langues (
                code INTEGER PRIMARY KEY,
                nom TEXT NOT NULL,
                type TEXT,
                information_complementaire TEXT
            )
        `);
        
        db.run(`
            CREATE TABLE IF NOT EXISTS diplomes_par_lycee (
                code INTEGER PRIMARY KEY,
                code_diplome INTEGER,
                code_lycee INTEGER,
                options TEXT,
                FOREIGN KEY (code_diplome) REFERENCES diplomes(code),
                FOREIGN KEY (code_lycee) REFERENCES lycees(code)
            )
        `);
        
        db.run(`
            CREATE TABLE IF NOT EXISTS formations_par_lycee (
                code INTEGER PRIMARY KEY,
                code_formation INTEGER,
                code_lycee INTEGER,
                FOREIGN KEY (code_formation) REFERENCES formations(code),
                FOREIGN KEY (code_lycee) REFERENCES lycees(code)
            )
        `);
        
        db.run(`
            CREATE TABLE IF NOT EXISTS dispositifs_par_lycee (
                code INTEGER PRIMARY KEY,
                code_dispositif INTEGER,
                code_lycee INTEGER,
                information_complementaire TEXT,
                FOREIGN KEY (code_dispositif) REFERENCES dispositifs(code),
                FOREIGN KEY (code_lycee) REFERENCES lycees(code)
            )
        `);
        
        db.run(`
            CREATE TABLE IF NOT EXISTS langues_par_lycee (
                code INTEGER PRIMARY KEY,
                code_langue INTEGER,
                code_lycee INTEGER,
                niveau TEXT,
                information_complementaire TEXT,
                FOREIGN KEY (code_langue) REFERENCES langues(code),
                FOREIGN KEY (code_lycee) REFERENCES lycees(code)
            )
        `);
    }
    
    /**
     * Charge les statistiques
     */
    function loadStats() {
        try {
            const stats = {
                lycees: db.exec('SELECT COUNT(*) as count FROM lycees')[0]?.values[0][0] || 0,
                diplomes: db.exec('SELECT COUNT(*) as count FROM diplomes')[0]?.values[0][0] || 0,
                formations: db.exec('SELECT COUNT(*) as count FROM formations')[0]?.values[0][0] || 0,
                dispositifs: db.exec('SELECT COUNT(*) as count FROM dispositifs')[0]?.values[0][0] || 0
            };
            
            document.getElementById('stat-lycees').textContent = stats.lycees;
            document.getElementById('stat-diplomes').textContent = stats.diplomes;
            document.getElementById('stat-formations').textContent = stats.formations;
            document.getElementById('stat-dispositifs').textContent = stats.dispositifs;
        } catch (error) {
            console.error('Erreur loadStats:', error);
        }
    }
    
    /**
     * Charge la liste des lycées
     */
    function loadLycees() {
        try {
            const result = db.exec('SELECT code, nom, type, statut, commune FROM lycees ORDER BY nom');
            
            const container = document.getElementById('lycees-container');
            
            if (!result.length || !result[0].values.length) {
                container.innerHTML = `
                    <div class="loading">
                        <p style="color: var(--text-light);">Aucun lycée dans la base.</p>
                        <p style="color: var(--text-light); font-size: 14px; margin-top: 10px;">
                            Cliquez sur "Rafraîchir depuis Onisep" pour charger les données.
                        </p>
                    </div>
                `;
                return;
            }
            
            const lycees = result[0].values;
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Type</th>
                            <th>Statut</th>
                            <th>Commune</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            for (const lycee of lycees) {
                const [code, nom, type, statut, commune] = lycee;
                const badgeClass = statut === 'public' ? 'badge-primary' : 'badge-success';
                
                html += `
                    <tr>
                        <td><strong>${nom || 'Sans nom'}</strong></td>
                        <td>${type || '-'}</td>
                        <td><span class="badge ${badgeClass}">${statut || '-'}</span></td>
                        <td>${commune || '-'}</td>
                    </tr>
                `;
            }
            
            html += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
            
        } catch (error) {
            console.error('Erreur loadLycees:', error);
            document.getElementById('lycees-container').innerHTML = `
                <div class="alert alert-error">
                    Erreur lors du chargement des lycées : ${error.message}
                </div>
            `;
        }
    }
    
    /**
     * Rafraîchit les données depuis l'API Onisep
     */
    async function refreshFromOnisep() {
        const modal = document.getElementById('onisep-modal');
        modal.classList.add('active');
        
        try {
            const api = new OnisepAPI();
            
            // Extraire les données
            const data = await api.extractRennesMetropole(progress => {
                updateProgress(progress);
            });
            
            // Mettre à jour la base
            await updateDatabaseFromOnisep(data);
            
            // Afficher le résumé
            showExtractionSummary(data);
            
            // Recharger
            loadStats();
            loadLycees();
            
            showAlert(`
                ✅ Extraction terminée !
                ${data.lycees.length} lycées, ${data.diplomes.length} diplômes, 
                ${data.formations.length} formations, ${data.langues.length} langues
            `, 'success');
            
        } catch (error) {
            console.error('Erreur extraction:', error);
            showAlert('Erreur lors de l\'extraction : ' + error.message, 'error');
        }
    }
    
    /**
     * Met à jour la barre de progression
     */
    function updateProgress(progress) {
        const fill = document.getElementById('progress-fill');
        const message = document.getElementById('progress-message');
        const details = document.getElementById('progress-details');
        
        const percent = Math.round(progress.percent || 0);
        fill.style.width = `${percent}%`;
        fill.textContent = `${percent}%`;
        
        message.textContent = progress.message || '';
        
        if (progress.current && progress.total) {
            details.textContent = `${progress.current} / ${progress.total}`;
        } else {
            details.textContent = '';
        }
    }
    
    /**
     * Met à jour la base depuis les données Onisep
     */
    async function updateDatabaseFromOnisep(data) {
        try {
            db.run('BEGIN TRANSACTION');
            
            // Vider les tables
            db.run('DELETE FROM lycees');
            db.run('DELETE FROM diplomes');
            db.run('DELETE FROM formations');
            db.run('DELETE FROM langues');
            db.run('DELETE FROM diplomes_par_lycee');
            db.run('DELETE FROM formations_par_lycee');
            db.run('DELETE FROM langues_par_lycee');
            
            // Insérer les lycées
            const insertLycee = db.prepare(`
                INSERT INTO lycees (code, nom, type, statut, uai, adresse_postale, 
                                    code_postal, commune, telephone, adresse_mail, 
                                    site_web, longitude_x, latitude_y, localisation)
                VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
            `);
            
            for (let i = 0; i < data.lycees.length; i++) {
                const lycee = data.lycees[i];
                insertLycee.run([
                    i + 1,
                    lycee.nom,
                    lycee.type,
                    lycee.statut,
                    lycee.uai,
                    lycee.adresse_postale,
                    lycee.code_postal,
                    lycee.commune,
                    lycee.telephone,
                    lycee.mail,
                    lycee.site_web,
                    lycee.longitude_x,
                    lycee.latitude_y,
                    lycee.commune
                ]);
            }
            insertLycee.free();
            
            // Insérer les diplômes
            const insertDiplome = db.prepare(`
                INSERT INTO diplomes (code, intitule, niveau)
                VALUES (?, ?, ?)
            `);
            
            for (let i = 0; i < data.diplomes.length; i++) {
                const diplome = data.diplomes[i];
                insertDiplome.run([i + 1, diplome.intitule, diplome.niveau]);
            }
            insertDiplome.free();
            
            // Insérer les formations
            const insertFormation = db.prepare(`
                INSERT INTO formations (code, intitule)
                VALUES (?, ?)
            `);
            
            for (let i = 0; i < data.formations.length; i++) {
                const formation = data.formations[i];
                insertFormation.run([i + 1, formation.intitule]);
            }
            insertFormation.free();
            
            // Insérer les langues
            const insertLangue = db.prepare(`
                INSERT INTO langues (code, nom, type, information_complementaire)
                VALUES (?, ?, ?, ?)
            `);
            
            for (let i = 0; i < data.langues.length; i++) {
                const langue = data.langues[i];
                const niveaux = Array.from(langue.niveaux).join(', ');
                insertLangue.run([i + 1, langue.nom, langue.type, niveaux]);
            }
            insertLangue.free();
            
            db.run('COMMIT');
            
            // Sauvegarder dans localStorage
            saveDatabase();
            
            console.log('✅ Base mise à jour');
            
        } catch (error) {
            db.run('ROLLBACK');
            throw error;
        }
    }
    
    /**
     * Affiche le résumé de l'extraction
     */
    function showExtractionSummary(data) {
        const summary = document.getElementById('extraction-summary');
        summary.style.display = 'block';
        
        summary.innerHTML = `
            <div class="alert alert-success">
                <strong>✅ Extraction terminée avec succès !</strong>
                <ul style="margin-top: 10px; margin-left: 20px;">
                    <li>${data.lycees.length} lycées extraits</li>
                    <li>${data.diplomes.length} diplômes identifiés</li>
                    <li>${data.formations.length} formations identifiées</li>
                    <li>${data.langues.length} langues extraites</li>
                    <li>${data.stats.actionsTotal} actions de formation analysées</li>
                    <li>${data.stats.requestCount} requêtes API effectuées</li>
                </ul>
            </div>
            <button class="btn-primary" onclick="closeOnisepModal()" style="margin-top: 20px; width: 100%;">
                Fermer
            </button>
        `;
    }
    
    /**
     * Ferme le modal Onisep
     */
    function closeOnisepModal() {
        document.getElementById('onisep-modal').classList.remove('active');
        document.getElementById('extraction-summary').style.display = 'none';
    }
    
    /**
     * Sauvegarde la base dans localStorage
     */
    function saveDatabase() {
        const data = db.export();
        const buffer = new Uint8Array(data);
        const base64 = btoa(String.fromCharCode(...buffer));
        localStorage.setItem('lycees_database', base64);
        console.log('✓ Base sauvegardée dans localStorage');
    }
    
    /**
     * Exporte la base en fichier .db
     */
    function exportDatabase() {
        const data = db.export();
        const blob = new Blob([data], { type: 'application/x-sqlite3' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `lycees_database_${new Date().toISOString().split('T')[0]}.db`;
        a.click();
        
        URL.revokeObjectURL(url);
        showAlert('✅ Base de données exportée', 'success');
    }
    
    /**
     * Import d'une base de données
     */
    function importDatabase() {
        document.getElementById('file-input').click();
    }
    
    /**
     * Gère l'import de fichier
     */
    async function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        try {
            const buffer = await file.arrayBuffer();
            db = new SQL.Database(new Uint8Array(buffer));
            
            saveDatabase();
            loadStats();
            loadLycees();
            
            showAlert('✅ Base de données importée avec succès', 'success');
        } catch (error) {
            showAlert('❌ Erreur lors de l\'import : ' + error.message, 'error');
        }
    }
    
    /**
     * Génère le document d'orientation
     */
    function generateDocument() {
        showAlert('⚠️  Fonction de génération de document à implémenter', 'warning');
        // TODO: Intégrer generate_guide_orientation_v5.py
    }
    
    /**
     * Affiche une alerte
     */
    function showAlert(message, type = 'info') {
        const alertsContainer = document.getElementById('alerts');
        const alertClass = type === 'success' ? 'alert-success' : 
                          type === 'error' ? 'alert-error' : 
                          type === 'warning' ? 'alert-warning' : 'alert-info';
        
        const alert = document.createElement('div');
        alert.className = `alert ${alertClass}`;
        alert.innerHTML = message;
        
        alertsContainer.appendChild(alert);
        
        setTimeout(() => {
            alert.remove();
        }, 5000);
    }
    </script>
